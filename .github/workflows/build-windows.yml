name: Build (Windows)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pkg-config
        shell: pwsh
        run: choco install pkgconfiglite -y

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-engine-x64-windows-v2
          restore-keys: vcpkg-engine-x64-windows-

      - name: Configure
        shell: pwsh
        run: |
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $env:PKG_CONFIG_PATH = "$installed\lib\pkgconfig"
          cmake -B build `
            -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
