name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libcairo2-dev libpango1.0-dev liblua5.4-dev

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cairo pango lua pkg-config ninja

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build --parallel

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-engine-x64-windows-v1
          restore-keys: vcpkg-engine-x64-windows-

      - name: Configure
        shell: pwsh
        run: |
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $env:PKG_CONFIG_PATH = "$installed\lib\pkgconfig"
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DPKG_CONFIG_EXECUTABLE="$installed\tools\pkgconf\pkgconf.exe"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
